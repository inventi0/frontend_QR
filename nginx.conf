server {
    listen 8080;
    server_name _;

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/qreate.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qreate.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # ============================================
    # Gzip Compression
    # ============================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/xml
        image/svg+xml;

    # ============================================
    # Security Headers
    # ============================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://ndd-widget.landpro.site https://*.yandex.ru https://yandex.ru https://*.yastatic.net https://yastatic.net https://*.yandex.net; style-src 'self' 'unsafe-inline' https://*.yastatic.net https://yastatic.net; img-src 'self' data: blob: https:; font-src 'self' data: https://*.yastatic.net https://yastatic.net https://*.yandex.net https://*.yandex.ru; connect-src 'self' http://45.8.248.97:8000 https://api.qreate.space https://ndd-widget.landpro.site https://*.yandex.ru https://yandex.ru https://*.yandex.net https://yandex.net wss://*.yandex.ru; frame-src 'self' https://ndd-widget.landpro.site https://*.yandex.ru https://*.yandex.net;" always;

    # ============================================
    # Static Assets Caching
    # ============================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ============================================
    # SPA Routing (React Router)
    # ============================================
    location / {
        try_files $uri /index.html;
    }

    # ============================================
    # API Proxy (если понадобится потом)
    # ============================================
    location /api/ {
        proxy_pass http://45.8.248.97:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}